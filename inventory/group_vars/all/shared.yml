files_dir: "{{playbook_dir}}/files"

home_dir: "{{ lookup('env', 'HOME') }}"

user_dirs:
  opt: "{{ home_dir }}/opt"
  downloads: "{{ home_dir }}/Downloads"
  bin: "{{ home_dir }}/bin"

persistent_user_config: 
  linux:
    shared: "{{ home_dir }}/config/linux/shared"
  windows:
    shared: "{{ home_dir }}/config/windows/shared"
  shared:
    "{{ home_dir }}/config/shared"

apt_keyring_dir: /etc/apt/keyrings

# Desktop environment to install and configure. Each one has a
# desktop-<name>.yml and dconf-restore-<name>.yml playbook.
desktop_environment: cinnamon
supported_desktop_environments:
- cinnamon
- mate

# dconf backups in persistent_user_config.linux.shared, per desktop environment.
# Cinnamon keeps the original file name. files/dconf/<name>.settings is
# restored instead until the backup exists.
dconf_backup_files:
  cinnamon: dconf.settings
  mate: dconf-mate.settings

# dconf keys (regexes over the full key path) which are never saved by pull.yml
# or restored: typed-input and recent-location history, which can capture
# anything that was pasted into a search box.
dconf_exclude:
- ^/org/gnome/gedit/state/history-entry/
- ^/org/x/editor/state/history-entry/
- ^/org/cinnamon/command-history$
- ^/org/cinnamon/looking-glass-history$
- ^/apps/seahorse/last-search-
- /last-folder-uri$
- /last-save-directory$
- /last-path$

network:
  vm_network: 192.168.122.1/24
