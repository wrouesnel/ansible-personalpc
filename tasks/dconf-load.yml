# Load a dconf keyfile, skipping the dconf_exclude keys. Only reports changed
# when the dconf database actually changed.
#   vars: dconf_load_file - the keyfile to load
- name: Restoring dconf settings from {{ dconf_load_file | basename }}
  shell: |
    set -o pipefail
    excludes=()
    while IFS= read -r pattern; do
        [ -n "$pattern" ] && excludes+=(--exclude "$pattern")
    done <<< "$DCONF_EXCLUDE"
    before="$(dconf dump /)"
    python3 "$DCONF_FILTER" "${excludes[@]}" "$DCONF_FILE" | dconf load /
    if [ "$before" != "$(dconf dump /)" ]; then echo changed; fi
  args:
    executable: /bin/bash
  environment:
    DCONF_EXCLUDE: "{{ dconf_exclude | join('\n') }}"
    DCONF_FILTER: "{{ [files_dir, 'dconf', 'filter.py'] | path_join }}"
    DCONF_FILE: "{{ dconf_load_file }}"
  register: dconf_load
  changed_when: dconf_load.stdout == 'changed'
