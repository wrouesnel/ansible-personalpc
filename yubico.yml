---
# Yubico Software
# Specifically, we want the yubico-piv-tool from upstream.
- hosts: localhost
  connection: local
  become: true
  tasks:
  - include_tasks: tasks/launchpad-ppa.yml
    vars:
      launchpad_ppa: yubico/stable
      launchpad_ppa_packages:
      - yubikey-manager
      - yubico-piv-tool
      - pamu2fcfg
      - libpam-u2f
      - fido2-tools
