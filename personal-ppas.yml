# Packages from my own Launchpad PPAs (https://launchpad.net/~w-rouesnel)
- hosts: localhost
  connection: local
  become: true
  vars:
    personal_ppas:
    - name: w-rouesnel/tmux-tabbed-terminal
      packages: [tmux-tabbed-terminal]
    - name: w-rouesnel/landhorse
      packages: [landhorse]
    - name: w-rouesnel/j2live
      packages: [j2live]
    - name: w-rouesnel/podman-desktop-ext
      packages: [podman-desktop-ext]
    - name: w-rouesnel/mfa-keyring
      packages: [mfa-keyring, libpam-mfa-keyring]
  tasks:
  - name: Check if pam_pwquality is enabled before installing
    command: grep -q pam_pwquality.so /etc/pam.d/common-password
    register: pam_pwquality_before
    failed_when: pam_pwquality_before.rc > 1
    changed_when: false
    check_mode: false

  - include_tasks: tasks/launchpad-ppa.yml
    vars:
      launchpad_ppa: "{{ personal_ppa.name }}"
      launchpad_ppa_packages: "{{ personal_ppa.packages }}"
    loop: "{{ personal_ppas }}"
    loop_control:
      loop_var: personal_ppa
      label: "{{ personal_ppa.name }}"

  # libpam-mfa-keyring recommends sssd, and libpam-sss depends on
  # libpam-pwquality, whose PAM profile enables itself on install. We don't
  # want password strength checks for now, so undo that if these installs
  # turned it on, but leave it alone if it was already enabled.
  - name: Check if pam_pwquality is enabled after installing
    command: grep -q pam_pwquality.so /etc/pam.d/common-password
    register: pam_pwquality_after
    failed_when: pam_pwquality_after.rc > 1
    changed_when: false
    check_mode: false

  - name: Disable the pam_pwquality profile
    command: pam-auth-update --disable pwquality
    when: pam_pwquality_before.rc != 0 and pam_pwquality_after.rc == 0
