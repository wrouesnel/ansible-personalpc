---
# General system configuration which doesn't fit elsewhere
- hosts: localhost
  connection: local
  become: true
  tasks:
  - name: Deploy configuration templates
    template:
      src: etc/default/localnetwork.j2
      dest: /etc/default/localnetwork
      owner: root
      group: root
      mode: "0644"
  
  - name: Set inotify user watches
    sysctl: 
      name: fs.inotify.max_user_watches
      value: '2097152'
      state: present
  
- hosts: localhost
  connection: local
  become: false
  tasks:
  - name: Ensure user directories exist
    file:
      path: "{{ item.value }}"
      state: directory
    loop: "{{user_dirs|dict2items}}"

  - name: Ensure .local/share/applications exists
    file:
      path: "{{ home_dir }}/.local/share/applications"
      state: directory

- hosts: localhost
  connection: local
  become: false
  tasks:
  - name: Ensure the user config dir exists
    block:
    - file:
        path: "{{ home_dir }}/config"
        state: directory
    
    - file:
        path: "{{ home_dir }}/config/linux"
        state: directory

    - file:
        path: "{{ home_dir }}/config/linux/shared"
        state: directory
  
  - name: Ensure user config bashrc loads
    lineinfile:
      path: "{{ home_dir }}/.bashrc"
      # Syncthing may not have delivered the file yet on a fresh machine.
      regexp: config/linux/shared/bashrc
      line: 'if [ -f "$HOME/config/linux/shared/bashrc" ]; then source "$HOME/config/linux/shared/bashrc"; fi'

  # Lets libsecret (and anything else using the session bus) reach the desktop
  # session's keyring from SSH, su or tmux shells. At the top of .bashrc so it
  # runs before the non-interactive early return.
  - name: Connect shells to the desktop session D-Bus
    blockinfile:
      path: "{{ home_dir }}/.bashrc"
      insertbefore: BOF
      marker: "# {mark} ANSIBLE MANAGED BLOCK session dbus"
      block: |
        if [ -z "$DBUS_SESSION_BUS_ADDRESS" ] && [ -S "/run/user/$(id -u)/bus" ]; then
            export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
        fi
