---
# Pull local settings into the repository for normalization.
- hosts: localhost
  connection: local
  tasks:
  # Skips the dconf_exclude keys, and only rewrites the backup when it changed.
  - name: Collect dconf configuration
    shell: |
      set -o pipefail
      tmp="$(mktemp)"
      trap 'rm -f "$tmp"' EXIT
      dconf dump / | awk -v exclude="$DCONF_EXCLUDE" -f "$DCONF_FILTER" > "$tmp"
      if ! cmp -s "$tmp" "$DCONF_BACKUP"; then cat "$tmp" > "$DCONF_BACKUP"; echo changed; fi
    args:
      executable: /bin/bash
    environment:
      DCONF_EXCLUDE: "{{ dconf_exclude | join('|') }}"
      DCONF_FILTER: "{{ [files_dir, 'dconf', 'filter.awk'] | path_join }}"
      DCONF_BACKUP: "{{ [persistent_user_config.linux.shared, dconf_backup_files[desktop_environment]] | path_join }}"
    register: dconf_pull
    changed_when: dconf_pull.stdout == 'changed'

  - name: Collect local gtk-3.0 config
    copy:
      src: >-
        {{ [ home_dir, ".config", "gtk-3.0", "gtk.css" ] | path_join }}
      dest: >-
        {{ [ files_dir, "home", ".config", "gtk-3.0", "gtk.css" ] | path_join }}
      remote_src: true