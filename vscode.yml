# Setup VS Code
- hosts: localhost
  connection: local
  become: true
  vars:
    vscode_keyring_location: /etc/apt/keyrings/packages.microsoft.asc
  tasks:
  - name: Get the keyring
    get_url:
      url: https://packages.microsoft.com/keys/microsoft.asc
      dest: "{{vscode_keyring_location}}"
      mode: "0644"
  
  - name: Check if the VS Code installed sources file is here
    stat:
      path: /etc/apt/sources.list.d/vscode.sources
    register: vscode_sources

  - name: Ensure vscode sources file
    copy:
      dest: /etc/apt/sources.list.d/vscode.list
      content: |
        deb [arch=amd64,arm64,armhf signed-by={{vscode_keyring_location}}] https://packages.microsoft.com/repos/code stable main
    when: not vscode_sources.stat.exists

  - name: Remove the .list file if sources exists
    file:
      path: /etc/apt/sources.list.d/vscode.list
      state: absent
    when: vscode_sources.stat.exists

  - name: Install VS Code
    apt:
      name:
      - code
      update_cache: true
      state: latest

  - name: Check if the VS Code installed sources file is here
    stat:
      path: /etc/apt/sources.list.d/vscode.sources
    register: vscode_sources

  - name: Ensure vscode sources file
    copy:
      dest: /etc/apt/sources.list.d/vscode.list
      content: |
        deb [arch=amd64,arm64,armhf signed-by={{vscode_keyring_location}}] https://packages.microsoft.com/repos/code stable main
    when: not vscode_sources.stat.exists

  - name: Remove the .list file if sources exists
    file:
      path: /etc/apt/sources.list.d/vscode.list
      state: absent
    when: vscode_sources.stat.exists

  - name: Make VS Code the default text editor
    community.general.alternatives:
      name: editor
      path: /usr/bin/code

  # Newer releases renamed code.desktop to com.microsoft.VSCode.desktop
  - name: Find the VS Code desktop file
    shell: dpkg -L code | grep -E '/applications/(code|com\.microsoft\.VSCode)\.desktop$'
    register: vscode_desktop_file
    changed_when: false
    check_mode: false

  - name: Check the default text/plain handler
    command: xdg-mime query default text/plain
    register: xdg_text_plain
    become: false
    changed_when: false
    check_mode: false

  - name: Make VS Code the default text/plain handler
    command: xdg-mime default {{ vscode_desktop_file.stdout | basename }} text/plain
    become: false
    when: xdg_text_plain.stdout | trim != vscode_desktop_file.stdout | basename